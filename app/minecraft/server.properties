server-port=25565
motd=OKTW GALAXY
max-players=100
max-tick-time=-1
enable-rcon=true
rcon.port=23456
rcon.password=password
function-permission-level=4
spawn-protection=0
sync-chunk-writes=false
enforce-secure-profile=false
# World lives under PVC mounted at /app/minecraft/saves (see galaxy-proxy Templates).
# Parent must be on the same FS as world so MC 26+ FileFixerUpper can atomic-move
# `world upgraded` during storage migration (cross-device mounts fail startup).
level-name=saves/world
